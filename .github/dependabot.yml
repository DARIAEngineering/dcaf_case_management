# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/githubDARIAEngineering/dcaf_case_management//administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "America/New_York"
    cooldown:
      semver-major-days: 60 # slower is preferable for us
    labels:
      - "dependencies"
    groups:
      ruby-chores:
        exclude-patterns:
          - "acts_as_tenant" # Doesn't use semvar
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "lomky"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "America/New_York"
    cooldown:
      semver-major-days: 60
    labels:
      - "dependencies"
    groups:
      js-chores:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "lomky"
    labels:
      - "dependencies"


